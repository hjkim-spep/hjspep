<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPEP AI 파일럿팅용 샘플 코스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --page:#E6E6E6; --surface:#FFFFFF; --ink:#000000; --ink-2:#333333; --muted:#6B6B6B;
  --line:#E2E2E2; --fill:#F3F3F3; --fill-2:#D6D6D6; --inv:#000000; --inv-ink:#FFFFFF; --frame:#1A1A1A;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#050505; --surface:#121212; --ink:#F5F5F5; --ink-2:#D0D0D0; --muted:#A0A0A0;
    --line:#2C2C2C; --fill:#1D1D1D; --fill-2:#3D3D3D; --inv:#F5F5F5; --inv-ink:#000000; --frame:#3A3A3A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#050505; --surface:#121212; --ink:#F5F5F5; --ink-2:#D0D0D0; --muted:#A0A0A0;
  --line:#2C2C2C; --fill:#1D1D1D; --fill-2:#3D3D3D; --inv:#F5F5F5; --inv-ink:#000000; --frame:#3A3A3A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--ink);font-family:'Pretendard','Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg{display:block}

.workspace{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:24px}
.side{width:248px;flex-shrink:0}
.side h1{font-size:24px;line-height:1.35;letter-spacing:-0.02em;margin:0 0 10px;font-weight:800}
.side p{font-size:13px;line-height:1.7;color:var(--muted);margin:0 0 20px}
.steps{display:flex;flex-direction:column;gap:2px;margin:0 0 20px;padding:0;list-style:none}
.steps button{display:flex;align-items:center;gap:12px;width:100%;padding:8px 6px;border-radius:10px;font-size:13px;color:var(--muted);text-align:left;min-height:40px}
.steps button span{width:24px;height:24px;border-radius:50%;border:1px solid var(--fill-2);display:grid;place-items:center;font-size:11px;flex-shrink:0}
.steps button.on{color:var(--ink);font-weight:700}
.steps button.on span{background:var(--inv);color:var(--inv-ink);border-color:var(--inv)}
.steps button:hover{background:var(--fill)}
.note{font-size:12px;line-height:1.7;color:var(--muted);border-top:1px solid var(--fill-2);padding-top:14px}

.fit{flex-shrink:0;transform-origin:center center}
.phone{width:393px;height:852px;background:var(--surface);border:10px solid var(--frame);border-radius:60px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-sizing:content-box;box-shadow:0 30px 80px rgba(0,0,0,.22)}
.island{height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 34px 0 40px;font-size:15px;font-weight:700}
.island i{width:124px;height:36px;border-radius:20px;background:#000;display:block}
.island b{width:46px}

.head{height:52px;flex-shrink:0;display:flex;align-items:center;gap:2px;padding:0 8px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.head strong{font-size:16px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line);flex-shrink:0}
.tabs button{height:44px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}

.pin{flex-shrink:0;background:var(--fill);padding:12px 20px 13px;border-bottom:1px solid var(--line)}
.pin .pat{font-size:14px;font-weight:800;line-height:1.45}
.pin p{margin:4px 0 0;font-size:12.5px;line-height:1.6;color:var(--ink-2)}
.taskbar{flex-shrink:0;background:var(--fill);padding:12px 20px;display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line)}
.label{font-size:11px;font-weight:800;letter-spacing:.03em;border:1.5px solid var(--ink);border-radius:6px;padding:2px 6px;flex-shrink:0;line-height:1.4}
.taskbar span:last-child{font-size:13.5px;font-weight:700;line-height:1.5}

.main{flex:1;overflow-y:auto;padding:18px 20px 16px;scrollbar-width:thin}
.foot{flex-shrink:0;padding:10px 20px 18px;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line)}
.foot .row{display:flex;gap:8px}
.cta{height:54px;border-radius:14px;background:var(--inv);color:var(--inv-ink);font-size:16px;font-weight:700;width:100%}
.cta:disabled{background:var(--fill-2);color:var(--muted)}
.ghost{height:54px;border-radius:14px;border:1px solid var(--fill-2);font-size:14px;font-weight:700;padding:0 16px;flex-shrink:0;color:var(--ink-2)}
.textbtn{height:44px;font-size:14px;font-weight:700;color:var(--ink-2)}

.slot{font-weight:800}
.muted{color:var(--muted)}
.tag{display:inline-block;font-size:12.5px;font-weight:700;color:var(--ink-2);background:var(--fill);border-radius:999px;padding:6px 11px;margin:0 6px 6px 0}

/* intro */
.intro h2{font-size:27px;line-height:1.3;letter-spacing:-.02em;margin:6px 0 10px;font-weight:800}
.intro .lead{font-size:15px;line-height:1.65;color:var(--ink-2);margin:0 0 22px}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:18px}
.role{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:10px;align-items:center}
.role small{display:block;font-size:12px;color:var(--muted)}
.role b{font-size:14px}
.block{border-radius:16px;padding:15px 16px;margin-bottom:10px}
.block.soft{background:var(--fill)}
.block.inv{background:var(--inv);color:var(--inv-ink)}
.block .h{font-size:12px;font-weight:800;margin-bottom:5px;opacity:.75}
.block p{margin:0;font-size:14.5px;line-height:1.6}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--fill);border-radius:12px;padding:4px;margin-top:8px}
.seg button{height:44px;border-radius:9px;font-size:14px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.mini-h{font-size:13px;font-weight:800;margin:20px 0 0}

/* avatar */
.av{width:36px;height:36px;border-radius:50%;background:var(--fill-2);overflow:hidden;flex-shrink:0;display:grid;place-items:end center;color:var(--surface)}
.av.me{background:var(--inv);color:var(--inv-ink);place-items:center;font-size:13px;font-weight:800}

/* chat */
.chat{display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:8px;align-items:flex-start}
.msg.me{justify-content:flex-end}
.msg .who{font-size:12px;color:var(--muted);margin-bottom:4px}
.bubble{border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:11px 13px;font-size:14.5px;line-height:1.55;max-width:272px}
.msg.me .bubble{background:var(--inv);color:var(--inv-ink);border-color:var(--inv);border-radius:16px 4px 16px 16px}
.bubble .ko{font-size:12.5px;line-height:1.55;margin-top:6px;opacity:.72}
.bubble.blur .en{filter:blur(5px);user-select:none}
.mtools{display:flex;gap:6px;margin-top:6px}
.chip{height:32px;min-width:32px;padding:0 9px;border-radius:16px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;color:var(--ink-2);background:var(--surface)}
.chip.on{background:var(--inv);color:var(--inv-ink);border-color:var(--inv)}
.target{border:1.5px solid var(--ink-2);border-radius:16px 4px 16px 16px;padding:13px;max-width:300px;margin-left:auto}
.target .hint-t{font-size:12px;font-weight:800;margin-bottom:8px}
.blanks{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:15px;font-weight:700;line-height:1.5}
.bar{display:inline-block;height:22px;border-radius:6px;background:var(--fill-2);vertical-align:middle}
.revealed{color:var(--muted);font-weight:700}
.fill{border-bottom:2px solid var(--ink);padding:0 1px}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.msg.me .typing i{background:var(--inv-ink)}
@keyframes blink{50%{opacity:.25}}
.msg.new{animation:rise .3s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion: reduce){.msg.new,.typing i{animation:none}}

/* cue */
.cue{display:flex;gap:9px;align-items:flex-start;margin-bottom:14px}
.cue .who{font-size:12px;color:var(--muted);margin-bottom:4px}
.cue .bubble{background:var(--fill);border-color:var(--fill)}

/* card */
.card{border:1px solid var(--line);border-radius:20px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card .en{font-size:21px;font-weight:700;line-height:1.42;letter-spacing:-.01em;text-align:center;min-height:60px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 6px}
.card .kor{font-size:13.5px;color:var(--muted);text-align:center;min-height:20px}
.card .bottom{display:flex;flex-direction:column;align-items:center;gap:4px}
.card .count{font-size:12px;font-weight:700;color:var(--muted)}
.round{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}

.fb{display:flex;gap:9px;align-items:flex-start;border-radius:12px;padding:11px 12px;margin-top:12px;font-size:13px;line-height:1.55;background:var(--fill)}
.fb.dash{background:transparent;border:1px solid var(--fill-2)}
.fb svg{flex-shrink:0;margin-top:1px}

/* dock */
.dock{flex-shrink:0;margin:0 16px 8px;border:1px solid var(--line);border-radius:20px;padding:6px 8px 8px;display:flex;flex-direction:column;gap:0}
.dock .dtop{display:flex;justify-content:space-between;align-items:center}
.dock .center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:66px;padding:0 4px}
.dock.locked{opacity:.4;pointer-events:none}
.dock{position:relative}
.pop{position:absolute;left:0;right:0;bottom:calc(100% + 10px);background:var(--surface);border:1.5px solid var(--ink);border-radius:16px;padding:10px 12px 14px 14px;box-shadow:0 14px 34px rgba(0,0,0,.2);z-index:5;animation:popin .18s ease-out}
.pop::after{content:"";position:absolute;left:20px;bottom:-8px;width:13px;height:13px;background:var(--surface);border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:rotate(45deg)}
.pop-h{display:flex;justify-content:space-between;align-items:center}
.pop-h b{font-size:13.5px}
.pop p{margin:0 0 4px;font-size:13.5px;line-height:1.55}
@keyframes popin{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion: reduce){.pop{animation:none}}
button.bar:hover{background:var(--muted)}
button.bar{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
.bar-hint{font-size:12.5px;font-weight:600;color:var(--muted);line-height:1}
button.bar:hover .bar-hint{color:var(--surface)}
.rec{width:48px;height:48px;border-radius:50%;background:var(--inv);color:var(--inv-ink);display:grid;place-items:center}
.rec.on{box-shadow:0 0 0 6px var(--fill-2);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px var(--fill)}}
@media (prefers-reduced-motion: reduce){.rec.on{animation:none}}
.dock .lbl{font-size:11.5px;color:var(--muted);min-height:14px;text-align:center}
.submit{width:100%;height:42px;border-radius:12px;background:var(--inv);color:var(--inv-ink);font-size:14px;font-weight:700}
.submit:disabled{background:var(--fill-2);color:var(--muted)}
.blank-in{border:1px solid transparent;border-radius:6px;background:var(--fill-2);font:inherit;font-size:12.5px;font-weight:700;line-height:20px;color:var(--ink);text-align:center;padding:0 3px;height:22px;outline:none;min-width:0;vertical-align:middle;box-sizing:border-box}
.blank-in:focus,.blank-in:focus-visible{border-color:var(--ink);outline:none}
.blank-in::placeholder{color:var(--muted);opacity:1;font-weight:600}
.was-blank{opacity:.45}
.hintbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}
.hintbtn.on{background:var(--inv);color:var(--inv-ink);border-color:var(--inv)}
.hintbtn:disabled{opacity:.35}
.toggle{display:flex;background:var(--fill);border-radius:22px;padding:3px}
.toggle button{width:38px;height:32px;border-radius:16px;display:grid;place-items:center;color:var(--muted)}
.toggle button.on{background:var(--inv);color:var(--inv-ink)}
.tin{display:flex;gap:6px;width:100%}
.tin input{flex:1;min-width:0;height:40px;border:1px solid var(--fill-2);border-radius:12px;padding:0 12px;background:var(--surface);font-size:14px;outline:none}
.tin input:focus{border-color:var(--ink)}
.tin button{width:40px;height:40px;border-radius:12px;background:var(--inv);color:var(--inv-ink);display:grid;place-items:center;flex-shrink:0}
.tin button:disabled{background:var(--fill-2);color:var(--muted)}

/* pattern */
.pcard{background:var(--inv);color:var(--inv-ink);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:10px}
.pcard .p{font-size:23px;font-weight:800;line-height:1.38;letter-spacing:-.01em}
.pcard .k{font-size:14px;opacity:.75}
.pcard .round{border-color:rgba(127,127,127,.5);color:inherit;align-self:flex-start}
.desc{font-size:14.5px;line-height:1.75;color:var(--ink-2);margin:14px 0 0}

/* summary */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--fill);border-radius:16px;padding:14px 4px;margin-bottom:16px}
.stats div{display:flex;flex-direction:column;align-items:center;gap:3px}
.stats div+div{border-left:1px solid var(--fill-2)}
.stats b{font-size:19px;font-weight:800}
.stats small{font-size:11.5px;color:var(--muted)}
.sec-h{font-size:15px;font-weight:800;margin:4px 0 8px}
.kp{border:1.5px solid var(--ink);border-radius:16px;padding:14px 16px;margin-bottom:6px}
.kp small{font-size:11.5px;font-weight:800;color:var(--muted)}
.kp .p{font-size:16px;font-weight:800;line-height:1.45;margin:3px 0}
.kp .k{font-size:12.5px;color:var(--muted)}
.item{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{flex:1}
.item .t b{display:block;font-size:14.5px;line-height:1.5;font-weight:700}
.item .t small{font-size:12.5px;color:var(--muted)}
.expand-btn{width:100%;border:1px solid var(--fill-2);border-radius:14px;height:52px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:700;margin-top:14px}
.badge{font-size:11px;font-weight:700;border:1px solid var(--fill-2);border-radius:6px;padding:2px 6px;color:var(--muted)}

/* expand */
.kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kw button{height:34px;border-radius:17px;border:1px solid var(--fill-2);padding:0 12px;font-size:13px;font-weight:700}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.prog .track{flex:1;height:4px;border-radius:2px;background:var(--fill-2);overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--ink)}
.prog span{font-size:12.5px;font-weight:700;color:var(--muted)}
.ans{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.ans.bad{border:1.5px solid var(--ink)}
.ans.review{border:1.5px solid var(--ink-2)}
.ans .st{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;margin-bottom:4px}
.ans .s{font-size:14.5px;font-weight:700;line-height:1.5}
.ans .toggle-note{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;gap:8px;min-height:44px}
.ans .note-body{font-size:13px;line-height:1.6;color:var(--ink-2);background:var(--fill);border-radius:10px;padding:10px 12px;margin-top:4px}

/* complete */
.done{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:30px}
.done .medal{width:112px;height:112px;border-radius:50%;background:var(--fill);display:grid;place-items:center;margin-bottom:18px}
.done .medal div{width:72px;height:72px;border-radius:50%;background:var(--inv);color:var(--inv-ink);display:grid;place-items:center}
.done h2{font-size:23px;line-height:1.35;margin:0 0 6px;font-weight:800}
.streak{border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:26px}
.streak .h{display:flex;justify-content:space-between;font-size:14.5px;font-weight:800;margin-bottom:14px}
.streak .h small{font-size:12px;color:var(--muted);font-weight:700}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.days div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.days i{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--fill-2);display:grid;place-items:center}
.days .y i{background:var(--inv);border:0;color:var(--inv-ink)}
.days .today{color:var(--ink);font-weight:800}
.days .y i b{font-size:12.5px;font-weight:800}
.days .today i{box-shadow:0 0 0 3px var(--fill-2)}
.next{background:var(--fill);border-radius:18px;padding:16px;margin-top:12px}
.next .h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700}
.next b{display:block;font-size:17px;margin:6px 0 4px}
.next p{margin:0;font-size:13.5px;line-height:1.6;color:var(--ink-2)}

.toast{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);background:var(--inv);color:var(--inv-ink);font-size:13px;font-weight:700;padding:10px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
.toast.on{opacity:1}

@media (max-width:760px){
  .workspace{padding:0;gap:0;min-height:0;height:100%}
  .side{display:none}
  .fit{width:100%;height:100%;transform:none!important}
  .phone{width:100%;height:100%;border:0;border-radius:0;box-shadow:none;box-sizing:border-box}
  .island{display:none}
}

/* ---------- course home ---------- */
.home-top{height:52px;flex-shrink:0;display:flex;justify-content:flex-end;align-items:center;gap:2px;padding:0 10px 0 20px}
.home-top h1{margin:0 auto 0 0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.streak-chip{display:flex;align-items:center;gap:4px;font-size:15px;font-weight:700;height:44px;padding:0 6px}
.htabs{display:flex;gap:22px;padding:0 20px;border-bottom:1px solid var(--line);flex-shrink:0}
.htabs button{height:44px;font-size:16px;font-weight:800;color:var(--muted);border-bottom:2px solid transparent}
.htabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.course{margin:14px 16px 4px;padding:16px;border-radius:16px;border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.08);background:var(--surface)}
.course .ch{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.course .tag2{border:1px solid var(--ink-2);border-radius:5px;font-size:12px;font-weight:600;padding:2px 6px;color:var(--ink-2);flex-shrink:0}
.course h2{font-size:17px;font-weight:800;margin:0;letter-spacing:-.01em}
.course .pr{display:flex;align-items:center;gap:10px}
.ptrack{flex:1;height:10px;border-radius:5px;border:1px solid var(--ink-2);overflow:hidden}
.ptrack i{display:block;height:100%;background:var(--ink);border-radius:5px}
.course .pct{font-size:14px;color:var(--ink-2);min-width:38px;text-align:right}

const q = s => String(s||'').replace(/'/g,'’');
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?]/g,'').replace(/\s+/g,' ').trim();
function tokenize(en){
  const out=[]; const re=/\{([^}]*)\}/g; let last=0, m;
  const push=(txt,slot)=>txt.split(/\s+/).filter(Boolean).forEach(w=>{
    if(/^[.,!?]+$/.test(w) && out.length){ out[out.length-1].tail+=w; return; }
    const mm=w.match(/^(.*?)([.,!?]*)$/); out.push({w:mm[1], tail:mm[2], slot});
  });
  while((m=re.exec(en))){ push(en.slice(last,m.index),false); push(m[1],true); last=re.lastIndex; }
  push(en.slice(last),false);
  return out;
}
const LESSONS = DATA.map(c=>({
  ...c,
  keyPatternEn:q(c.keyPatternEn),
  tags:String(c.patternTags||'').split(/\s+(?=#)/).filter(Boolean),
  keywords:String(c.expandKeywords||'').split(',').map(t=>t.trim()).filter(Boolean),
  dialog:c.dialog.map(d=>({who:d.speaker==='User'?'me':'ai', en:q(d.en), ko:d.kr||''})),
  sents:c.sentences.map(s=>({en:q(s.en), kr:s.kr||'', cue:s.cue||'', words:tokenize(q(s.en))}))
}));
const L = () => LESSONS[S.li];
const plain = s => String(s).replace(/[{}]/g,'');
const enHtml = s => esc(s).replace(/\{([^}]*)\}/g,'<span class="slot">$1</span>');
const krHtml = s => esc(s).replace(/\{([^}]*)\}/g,'<b style="font-weight:700;color:var(--ink-2)">$1</b>');
const patHtml = s => esc(s).replace(/\[([^\]]*)\]/g,'<span class="slot">[$1]</span>');
const lines = s => esc(s).replace(/\n/g,'<br>');
const stem = l => l.keyPatternEn.replace(/\s*\[[^\]]*\]/g,' ~').trim();
const sentence = i => plain(L().sents[i].en);
function fillPattern(l,kw){ const parts=kw.split(/\s*\/\s*/); let i=0; let s=l.keyPatternEn.replace(/\[[^\]]*\]/g,()=>parts[i++]??parts[parts.length-1]).trim(); if(!/[.!?]$/.test(s)) s+='.'; return s; }

function speak(t){ try{ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t.replace(/’/g,"'")); u.lang='en-US'; u.rate=.9; speechSynthesis.speak(u);}catch(e){} }

function weekDays(){ const t=new Date(), dow=(t.getDay()+6)%7, mon=new Date(t); mon.setDate(t.getDate()-dow); return Array.from({length:7},(_,k)=>{ const d=new Date(mon); d.setDate(mon.getDate()+k); return {k, d, today:k===dow, c:(S.store.log||{})[dayStr(d)]||0}; }); }
function weekTotal(){ return weekDays().reduce((s,x)=>s+x.c,0); }
function weekRow(){ return weekDays().map(x=>`<div class="${x.c?'y':''} ${x.today?'today':''}"><i aria-label="${x.c}개 완료">${x.c?`<b>${x.c}</b>`:''}</i>${x.today?'오늘':'월화수목금토일'[x.k]}</div>`).join(''); }
function markDone(id){
  id = id || L().coreId;
  S.store.log = S.store.log || {}; { const td=dayStr(new Date()); S.store.log[td]=(S.store.log[td]||0)+1; } if(!S.store.done.includes(id)) S.store.done.push(id);
  const today=dayStr(new Date()), y=new Date(); y.setDate(y.getDate()-1);
  if(S.store.last!==today){ S.store.streak = S.store.last===dayStr(y) ? S.store.streak+1 : 1; S.store.last=today; }

}
function go(n){
  stopRec(true); S.seq++; hush();

  if(S.stage===7) S.openOne=S.exp.attempts.findIndex(x=>x.kind!=='good' && x.kind!=='off');
  render(); document.querySelector('.main')?.scrollTo(0,0);

}

/* ---------- guidechat sequence ---------- */
function startGuide(){
  const token=S.seq, D=L().dialog;
  const step=()=>{
    if(token!==S.seq||S.stage!==1||S.view!=='lesson') return;
    if(S.g.shown>=D.length){ S.g.typing=false; S.g.fresh=-1; render(); scrollMain(); return; }
    S.g.typing=true; S.g.fresh=-1; render(); scrollMain();
    setTimeout(()=>{
      if(token!==S.seq||S.stage!==1) return;
      S.g.typing=false; S.g.fresh=S.g.shown; S.g.shown++; render(); scrollMain();
      speakThen(D[S.g.shown-1].en, ()=>setTimeout(step,350));
    },700);
  };
  step();
}

function gBlanks(){
  const words=L().sents[0].words, idx=gIdx();
  const answerable = !S.g.done && S.g.shown>=L().dialog.length && !S.g.typing;
  const inline = S.mode==='text' && answerable;

/* ---------- recording (simulated) ---------- */
function toggleRec(){

const score = () => 78 + Math.floor(Math.random()*18);
const ENC = () => ({kind:'soft', text:`그 표현도 좋아요! 이번엔 ‘${stem(L())}’ 패턴을 써볼 거예요.`});
const GOOD = sc => ({kind:'good', text:`정답이에요!${sc?` 발음 일치도 ${sc}%.`:''} 이 상황에 딱 맞는 ‘${stem(L())}’ 패턴을 자세히 익혀 볼게요.`});

function onVoice(){
  if(S.view==='app'){ const A=S.app, T=APP_TURNS[A.t]; if(A.awaiting) appSubmit(T.voice[Math.min(A.attempt,T.voice.length-1)],true); return; }
  const st=S.stage;
  if(st===1){ S.g.done=true; S.g.correct=true; S.g.userText=plain(L().sents[0].en); S.g.fb=GOOD(score()); speak(sentence(0)); }
  if(st===3){ const i=S.ex.i; S.ex.done[i]=true; S.ex.fb[i]={kind:'good', text:`발음 일치도 ${score()}%. 리듬과 억양이 자연스러워요.`}; }
  if(st===4){ const i=S.b.i; S.b.voiced[i]=true; S.b.inp[i]=bIdx(i).map(wi=>L().sents[i].words[wi].w); if(S.b.done[i]) (S.b.dirty ||= [])[i]=true; /* 인식된 내용을 빈칸에 바로 입력 (수정 가능) */ }
  if(st===6){ const samples = VOICE[L().coreId] || L().keywords.map(k=>q(fillPattern(L(),k))); if(samples.length){ addAttempt(samples[S.exp.vi % samples.length], true); S.exp.vi++; } }
}
/* 플래시카드·센텐스 빌딩 공통: 입력(녹음 또는 타이핑)이 있으면 정답 확인 가능 */
function canCheck(){
  if(S.view!=='lesson') return false;
  if(S.stage===3){ const i=S.ex.i; return !S.ex.done[i] && !!(S.ex.voiced[i] || S.ex.typed.trim()); }
  if(S.stage===4){ const i=S.b.i; return (!S.b.done[i] || !!(S.b.dirty&&S.b.dirty[i])) && !!(S.b.voiced[i] || (S.b.inp[i]||[]).some(v=>v && v.trim())); }
  return false;
}
function syncCta(){ const cb=document.getElementById('ctabtn'); if(cb && cb.dataset.a==='check') cb.disabled=!canCheck(); }
/* 센텐스 빌딩: 정답 확인 후 새로 입력하면 CTA를 다시 '정답 확인'으로 */
function markDirty(){
  if(S.view!=='lesson' || S.stage!==4) return; const i=S.b.i;
  if(!S.b.done[i]) return;
  (S.b.dirty ||= [])[i]=true;
  const cb=document.getElementById('ctabtn'); if(cb && cb.dataset.a!=='check'){ const tmp=document.createElement('div'); tmp.innerHTML=ctaBtn(false); cb.replaceWith(tmp.firstChild); }
  syncCta();
}
function doCheck(){
  if(S.stage===3){
    const i=S.ex.i, v=S.ex.typed.trim();
    if(v){ const ok=norm(v)===norm(sentence(i)); S.ex.fb[i] = ok ? {kind:'good', text:'원문과 똑같이 입력했어요. 음성을 들으며 소리 내어 읽어 보세요.'} : {kind:'soft', text:'조금 달라요. 원문과 비교해 보세요.'}; }
    else S.ex.fb[i]={kind:'good', text:`발음 일치도 ${score()}%. 리듬과 억양이 자연스러워요.`};
    S.ex.done[i]=true; S.ex.typed=''; stopRec(true); speak(sentence(i));
  }
  if(S.stage===4){
    const i=S.b.i, inp=S.b.inp[i]||[], words=L().sents[i].words;
    if(inp.some(v=>v && v.trim())){
      const fixes=bIdx(i).map((wi,k)=>{ const ty=(inp[k]||'').trim(), an=words[wi].w, a1=norm(ty), a2=norm(an);
        if(a1===a2) return null;
        const type=!a1 ? 'empty' : stemW(a1)===stemW(a2) ? 'form' : lev(a1,a2)<=2 ? 'spell' : 'word';
        return {typed:ty, ans:an, type}; }).filter(Boolean);
      if(!fixes.length) S.b.fb[i]={kind:'good', title:'정답이에요', score: S.b.voiced[i] ? score() : 0};
      else {
        const has=t=>fixes.some(f=>f.type===t);
        const title = has('word') ? 'Key Pattern을 확인해 볼까요?' : has('form') ? '문법을 고쳐 볼까요?' : has('spell') ? '철자를 확인해 볼까요?' : '빈칸을 채워 볼까요?';
        const tags=['Key Pattern 미완성'].concat(has('word')?['의미 오류']:[], has('form')?['문법 오류']:[], has('spell')?['철자 오류']:[], has('empty')?['빈칸 미입력']:[]);
        const note = has('word') ? `Key Pattern은 ‘${stem(L())}’ 형태로 써요. 다른 단어가 들어가면 표현의 의미가 달라져요.` : has('form') ? '단어는 맞지만 형태가 달라요. 패턴에 쓰인 형태 그대로 써야 문법적으로 맞아요.' : has('spell') ? '거의 맞았어요. 철자만 확인해 보세요.' : '비어 있는 빈칸을 채워 보세요.';
        S.b.fb[i]={kind:'bad', title, note, tags, fixes, showAns:true};
      }
    }
    else S.b.fb[i]={kind:'good', title:'정답이에요', score:score()};
    if(S.b.dirty) S.b.dirty[i]=false;
    S.b.done[i]=true; stopRec(true); speak(sentence(i));
  }
  render();
}
/* 센텐스 빌딩 피드백: 리프레이징과 같은 카드 양식. 정답이면 판정만 + 콜로케이션(뜻·음성·저장) */
function lev(a,b){ const m=a.length,n=b.length, d=Array.from({length:m+1},(_,i)=>[i].concat(Array(n).fill(0))); for(let j=1;j<=n;j++) d[0][j]=j; for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
function bfbHtml(i){
  const f=S.b.fb[i]; if(!f) return '';
  const icon = f.kind==='good' ? 'check' : f.kind==='bad' ? 'x' : 'alert';
  let body='';
  if(f.kind==='good'){
    const s=plain(L().sents[i].en).replace(/’/g,"'");
    const re=fm=>new RegExp('\\b'+fm.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/'/g,"['’]")+'\\b','i');
    const ents=colEntries();
    body=ents.map((e,k)=>({e,k})).filter(({e})=>((e.forms&&e.forms.length)?e.forms:[e.en]).some(fm=>re(fm).test(s))).map(({e,k})=>{
      const saved=S.colbm.has(L().coreId+':'+k);
      return `<div class="colrow"><div class="cr-t"><b>${esc(e.en)}</b><span>${esc(e.kr)}</span></div><button class="chip" data-speak="${esc(e.en.replace(/\bA\b|\bB\b|\[[^\]]*\]/g,'').replace(/\s+/g,' ').trim())}" aria-label="발음 듣기">${ic('speaker',15)}</button><button class="chip ${saved?'on':''}" data-a="colsave" data-k="${k}" aria-label="${saved?'단어장에서 빼기':'단어장에 저장'}" aria-pressed="${saved}">${ic('bookmark',15,saved)}</button></div>`;
    }).join('');
  } else {
    const WHY={word:'다른 단어라 의미가 달라져요', form:'형태가 달라요', spell:'철자가 달라요', empty:'비어 있어요'};
    if(f.tags) body+=`<div class="chips2" style="margin-top:8px">${f.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`;
    if(f.fixes) body+=f.fixes.map(x=>`<div class="fixrow"><span class="err">${esc(x.typed||'(빈칸)')}</span><span aria-hidden="true">→</span><b>${esc(x.ans)}</b><span class="why">${WHY[x.type]}</span></div>`).join('');
    if(f.note) body+=`<div class="note-body" style="margin-top:8px">${esc(f.note)}</div>`;
    if(f.showAns){ const s0=plain(L().sents[i].en); body+=`<div class="ans-sent"><span class="rc-lbl" style="margin:0">정답 문장</span><span style="flex:1">${recHtml(L(),s0)}</span><button class="chip" data-speak="${esc(s0)}" aria-label="정답 문장 듣기">${ic('speaker',15)}</button></div>`; }
  }
  return `<div class="ans ${f.kind==='good'?'':f.kind}" style="margin-top:12px" data-fb="${esc('b'+i+'|'+f.title)}"><div class="st">${ic(icon,16)}${esc(f.title)}${f.score?`<span class="muted" style="font-weight:500">· 발음 일치도 ${f.score}%</span>`:''}</div>${body}</div>`;
}
function ctaBtn(done){ return done ? `<button class="cta" id="ctabtn" data-a="cnext">다음으로</button>` : `<button class="cta" id="ctabtn" data-a="check" ${canCheck()?'':'disabled'}>정답 확인</button>`; }
function pager(i,n,doneArr){
  return `<div class="pager"><button class="iconbtn" data-a="bprev" aria-label="이전 카드" ${i===0?'disabled':''}>${ic('back',20)}</button><span class="dots" aria-hidden="true">${Array.from({length:n},(_,k)=>`<i class="${k===i?'on':''} ${doneArr[k]?'ok':''}"></i>`).join('')}</span><button class="iconbtn" data-a="bfwd" aria-label="다음 카드" ${i===n-1?'disabled':''}><span style="display:grid;transform:scaleX(-1)">${ic('back',20)}</span></button></div>`;
}
function onText(){
  if(S.view==='app'){ appSubmit(S.app.typed,false); return; }
  const st=S.stage;
  if(st===1){ if(!gFilled()) return; S.g.done=true;
    /* 내가 입력한 문장은 그대로 두고, 빈칸별로 비교해 피드백 강도를 나눔 */
    const w0=L().sents[0].words, idx=gIdx();
    S.g.userText = w0.map((x,wi)=>{ const k=idx.indexOf(wi); return (k<0 ? x.w : ((S.g.inp[k]||'').trim()||'___')) + x.tail; }).join(' ');
    const fixes=idx.map((wi,k)=>{ const a1=norm(S.g.inp[k]||''), a2=norm(w0[wi].w); if(a1===a2) return null; return {typed:(S.g.inp[k]||'').trim(), ans:w0[wi].w, type: stemW(a1)===stemW(a2) ? 'form' : lev(a1,a2)<=2 ? 'spell' : 'word'}; }).filter(Boolean);
    S.g.correct = !fixes.length;
    const words=fixes.filter(f=>f.type==='word');
    S.g.fb = !fixes.length ? GOOD()
      : !words.length ? {kind:'soft', text:`거의 맞았어요! ${fixes.map(f=>`‘${f.typed}’ → ‘${f.ans}’`).join(', ')} 부분만 다시 확인해 보세요. 이제 패턴을 자세히 익혀 볼게요.`}
      : (words.length===1 && fixes.length<=2) ? {kind:'soft', text:`좋은 시도예요! ‘${words[0].typed}’ 대신 ‘${words[0].ans}’ 하나만 바꾸면 이 상황에 딱 맞는 표현이 돼요. 이제 패턴을 자세히 익혀 볼게요.`}
      : {kind:'soft', text:`좋은 시도예요! 이 상황에서는 ‘${stem(L())}’ 패턴을 써요. 지금부터 함께 익혀 볼게요.`};
    speak(sentence(0)); }
  if(st===3){
    const i=S.ex.i, v=S.ex.typed.trim(); if(!v) return;
    const ok=norm(v)===norm(sentence(i));
    S.ex.fb[i] = ok ? {kind:'good', text:'원문과 똑같이 입력했어요. 음성을 들으며 소리 내어 읽어 보세요.'} : {kind:'soft', text:'조금 달라요. 원문과 비교해 보세요.'};
    S.ex.done[i]=true; S.ex.typed=''; speak(sentence(i)); render(); return;
  }
  if(st===4){ if(canCheck()) doCheck(); return; }
  if(st===6){ const v=S.exp.typed.trim(); if(!v) return; addAttempt(v,false); S.exp.typed=''; }
  render();
}

/* ---------- expansion evaluation (generic) ---------- */
/* 레슨 관련성: 레슨 문장·대화·키워드·콜로케이션의 단어와 하나라도 겹치는지 */
const STOP=new Set('the a an and or but to of in on at for with is are was were be been it its i we you they my our your this that these those can could would should will do does did not so just really very all some more next want like get got have has had there what which how us me too also about from by as up out if then than usually go going need still'.split(' '));
const stemW = w => w.replace(/'s$/,'').replace(/ies$/,'y').replace(/s$/,'');
function lessonVocab(l){
  if(l._voc) return l._voc;
  const txt=[l.keyPatternEn, ...l.sents.map(x=>plain(x.en)), ...l.dialog.map(d=>d.en), ...l.keywords, ...((typeof GLOSS!=='undefined' && GLOSS[l.coreId])||[]).flatMap(g=>g.forms||[])].join(' ');
  l._voc=new Set(norm(txt).split(/[\s\/-]+/).map(stemW).filter(w=>w.length>=3 && !STOP.has(w)));
  return l._voc;
}
const related = (l,s) => { const v=lessonVocab(l); return norm(s).split(/[\s\/-]+/).map(stemW).some(w=>w.length>=3 && !STOP.has(w) && v.has(w)); };
function evaluate(l,s){
  const iw = x => x.replace(/\bi would\b/g,"i'd");
  const n=iw(norm(s)), fx=l.keyPatternEn.split(/\[[^\]]*\]/).map(p=>iw(norm(p)));
  const keep={kind:'review', title:'Key Pattern을 사용하지 않았어요', note:`뜻은 통하는 문장이에요. 다만 이번 레슨에서는 ‘${stem(l)}’ 패턴을 넣어 말해 보세요.`};
  const miss = () => related(l,s) ? keep : {kind:'off', title:'레슨과 맞지 않는 문장이에요', note:`이번 레슨의 상황과 관련된 내용으로, ‘${stem(l)}’ 패턴을 넣어 말해 보세요.`};
  if(!n.startsWith(fx[0])) return miss();
  let rest=n.slice(fx[0].length); const slots=[];
  for(let k=1;k<fx.length;k++){
    const f=fx[k];
    if(!f){ slots.push(rest.trim()); rest=''; continue; }
    const idx=rest.indexOf(f); if(idx<0) return miss();
    slots.push(rest.slice(0,idx).trim()); rest=rest.slice(idx+f.length);
  }
  if(!slots.length || slots.some(x=>!x)) return {kind:'bad', title:'빈자리를 채워 볼까요?', note:l.slotGuide || '~ 자리에 내 상황을 넣어 말해 보세요.'};
  const all=slots.join(' ');
  if(/\b(informations|advices|feedbacks|equipments|furnitures)\b/.test(all)) return {kind:'bad', title:'문법을 고쳐 볼까요?', note:'information, advice, feedback 같은 셀 수 없는 명사에는 -s를 붙이지 않아요.'};
  { const m=all.match(/\b(didn't|doesn't|don't) (\w+ed)\b/); if(m) return {kind:'bad', title:'문법을 고쳐 볼까요?', note:`${m[1]} 뒤에는 동사원형이 와요. ${m[2]} 대신 원형으로 말해 보세요.`}; }
  { const m=all.match(/\b(a|an|another) (extra |more )?(\w*[^s\s]s)\b/); if(m) return {kind:'bad', title:'문법을 고쳐 볼까요?', note:`a/an은 단수 명사 앞에만 써요. ${m[3]}처럼 복수형이면 a/an을 빼거나 some을 써 보세요.`}; }
  /* C002: against 앞뒤 형태 맞추기 (병렬 구조) */
  if(l.coreId==='C002' && slots.length===2){
    const DET=/^(the|a|an|my|our|your|this|that|these|those|his|her|their|its|some|more|less)$/;
    const sw=slots.map(x=>x.split(' ')), ing=sw.map(w=>/ing$/.test(w[0]));
    if(ing[0]!==ing[1]){
      const g=ing[0]?sw[0]:sw[1], o=ing[0]?sw[1]:sw[0];
      if(g.length>=2 && o.length>=2 && !DET.test(o[0])) return {kind:'bad', title:'문법을 고쳐 볼까요?', note:`against 앞뒤는 형태를 맞춰야 해요. 한쪽이 -ing(${g[0]})면 다른 쪽(${o[0]})도 -ing 형태로 맞춰 보세요.`};
    }
  }
  /* C003: I’d 뒤에는 동사원형, 그리고 행동을 나타내는 동사 */
  if(l.coreId==='C003'){
    const v=(slots[0]||'').split(' ')[0];
    if(/ed$/.test(v) && !/^(need|proceed|feed|exceed|succeed|speed|seed)$/.test(v)) return {kind:'bad', title:'문법을 고쳐 볼까요?', note:`I’d(=I would) 뒤에는 동사원형이 와요. ${v} 대신 원형으로 말해 보세요.`};
    if(/^(know|understand|believe|think|feel|want|like|love|remember|agree|be)$/.test(v)) return {kind:'review', title:'상황에 맞게 다듬어 볼까요?', note:`문법은 맞아요. 다만 이 패턴은 근거를 바탕으로 앞으로 할 조치를 권하는 표현이라, ${v}처럼 상태를 나타내는 동사보다 check, start, move처럼 행동을 나타내는 동사가 자연스러워요.`};
  }
  if(/\b(terrible|awful|disgusting|gross|horrible|careless|stupid|rude|useless)\b|your fault/.test(all)) return {kind:'review', title:'상황에 맞게 다듬어 볼까요?', note:
    l.coreId==='C004' ? '문법은 맞아요. 다만 mix-up은 누구 잘못인지 따지지 않고 착오를 알리는 표현이라, terrible처럼 상대를 탓하는 말을 넣으면 표현의 의도와 어긋나고 무례하게 들려요.'
    : l.coreId==='C005' ? '문법은 맞아요. 다만 disgusting처럼 음식을 깎아내리는 말은 정정 요청을 공격적으로 들리게 해요. 잘못 나온 메뉴 이름을 그대로 말하는 게 자연스러워요.'
    : '문법은 맞아요. 다만 상대를 탓하거나 깎아내리는 말이 들어가면 표현의 의도와 어긋나고 무례하게 들려요.'};
  if(l.coreId==='C006' && /money back|refund|discount|for free|compensation/.test(all)) return {kind:'review', title:'상황에 맞게 다듬어 볼까요?', note:'문법은 맞아요. 다만 Could we get ~, too?는 빠진 메뉴나 소품처럼 가벼운 추가 요청에 쓰는 표현이라, 환불처럼 무거운 요구를 덧붙이듯 말하면 어색해요. 이럴 땐 따로 정중하게 요청하는 게 좋아요.'};
  if(/\b(dinner|lunch|eat|movie|party|vacation|snack|shirt|shirts|shoes|clothes|outfit|color|colour)\b/.test(all)) return {kind:'review', title:'상황에 맞게 다듬어 볼까요?', note: l.coreId==='C002' ? '문법은 맞아요. 다만 weigh A against B는 업무상 중요한 결정을 신중하게 따질 때 쓰는 표현이라, 셔츠 고르기처럼 가벼운 선택에는 무겁게 들려요. 이럴 땐 choose between A and B 정도가 자연스러워요.' : '문법은 맞아요. 다만 업무 상황에 쓰는 표현이라, 가벼운 일상 주제에는 무겁게 들릴 수 있어요.'};
  return {kind:'good', title:'아주 좋아요', note:'상황에 맞게 Key Pattern을 활용했어요.'};
}
function addAttempt(s,voice){
  if(S.exp.attempts.length>=10){ toast('10문장을 모두 시도했어요'); return; }
  let txt=q(s.trim()); if(!/[.!?]$/.test(txt)) txt+='.';
  S.exp.attempts.push({s:txt, voice, ...evaluate(L(),txt)});
}

/* ---------- render ---------- */
function render(){
  const app=document.getElementById('app');
  const key = S.view==='home' ? 'home' : S.view==='app' ? 'app-'+S.app.stage : 's'+S.stage;
  const html = S.view==='home' ? home() : S.view==='app' ? appScreen() : [intro,guide,pattern,examples,building,summary,expand,expandSummary,complete][S.stage]();
  const focused=document.activeElement && document.activeElement.id==='tin';
  const same=S._last===key;
  const pm=app.querySelector('.main'), prevTop=pm?pm.scrollTop:0;
  const prevFb=new Set([...app.querySelectorAll('[data-fb]')].map(x=>x.dataset.fb));
  app.innerHTML=html;
  hideCol(); wrapCols(app);
  const m=app.querySelector('.main'); if(m && same) m.scrollTop=prevTop;
  if(same){ const nf=[...app.querySelectorAll('[data-fb]')].filter(x=>!prevFb.has(x.dataset.fb)); if(nf.length){ const el=nf[nf.length-1]; requestAnimationFrame(()=>el.scrollIntoView({block:'nearest',behavior:'smooth'})); } }
  S._last=key;
  document.getElementById('steps').innerHTML = `<li><button class="homebtn ${S.view==='home'?'on':''}" data-a="home"><span>⌂</span>코스 홈</button></li>` + (S.view==='app' ? `<li class="steps-unit">U${UNIT.order} Application</li>` + ['레슨 안내','가이드챗','피드백 확인','레슨 종료'].map((n,i)=>`<li><button class="${['intro','chat','result','done'][i]===S.app.stage?'on':''}" disabled><span>${i+1}</span>${n}</button></li>`).join('') : S.view==='home'
    ? UNITS.map((u,ui)=>`<li class="steps-unit">UNIT ${pad2(u.order)}. ${esc(u.title)}${({U01:' (비즈니스 샘플)',U02:' (데일리 샘플)'})[u.id]||''}</li>` + LESSONS.map((l,i)=> l.unitId===u.id ? `<li><button data-open="${i}"><span>${i+1}</span>${esc(l.coreTitle)}</button></li>` : '').join('') + `<li><button data-a="openapp" data-u="${ui}"><span>A</span>Application</button></li>`).join('')
    : `<li class="steps-unit">U${(UNITS.find(u=>u.id===L().unitId)||{order:''}).order} L${L().coreOrder} ${esc(L().coreTitle)}</li>` + STAGES.map((n,i)=>`<li><button class="${i===S.stage?'on':''}" data-go="${i}"><span>${i+1}</span>${n}</button></li>`).join(''));
  document.getElementById('sidehint').textContent = S.view==='home' ? '레슨을 골라 시작하세요.' : S.view==='app' ? `${UNIT.title} Application 진행 중` : `${L().coreTitle} 진행 중`;
  const tin=document.getElementById('tin');
  if(tin){
    tin.addEventListener('input',e=>{ const v=e.target.value; if(S.view==='app'){ S.app.typed=v; return; } if(S.stage===3){ S.ex.typed=v; syncCta(); } if(S.stage===6) S.exp.typed=v; });
    tin.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); onText(); }});
    if(focused) tin.focus();
  }
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');
  if(S.view==='lesson' && S.stage===6 && S.exp.hint && !e.target.closest('.pop') && !(t && t.dataset.a==='hint')){ S.exp.hint=false; render(); if(!t) return; }
  if(!t||t.disabled) return;
  const d=t.dataset;
  if(d.sel!==undefined){ S.sel=d.sel; render(); return; }
  if(d.open!==undefined){ openLesson(+d.open); return; }
  if(d.nav){ if(d.nav!=='learn') toast('프로토타입에서는 Learn만 체험할 수 있어요'); return; }
  if(d.blank!==undefined){ const k=d.blank; S.mode='text'; stopRec(true); render(); document.querySelector(`.blank-in[data-k="${k}"]`)?.focus(); return; }
  if(d.go!==undefined){ go(+d.go); return; }
  if(d.mode){ S.mode=d.mode; stopRec(true); render(); if(S.mode==='text') (document.querySelector('.blank-in')||document.getElementById('tin'))?.focus(); return; }
  if(d.speak){ speak(d.speak); return; }
  if(d.ko!==undefined){ S.g.ko[d.ko]=!S.g.ko[d.ko]; render(); return; }
  if(d.blur!==undefined){ S.g.blur[d.blur]=!S.g.blur[d.blur]; render(); return; }
  if(d.bm!==undefined){ const i=+d.bm; if(S.bm.has(i)){S.bm.delete(i); toast('저장을 취소했어요');} else {S.bm.add(i); toast('보관함에 저장했어요');} render(); return; }
  if(d.kw){ S.exp.hint=false; S.mode='text'; S.exp.typed=q(fillPattern(L(),d.kw)); render(); document.getElementById('tin')?.focus(); return; }
  if(d.openNote!==undefined){
    /* 하나만 열기 + 누른 항목이 화면에서 튀지 않도록 위치 보정 */
    const idx=+d.openNote, phone=document.getElementById('phone');
    const sc=phone.getBoundingClientRect().width/phone.offsetWidth || 1;
    const before=t.getBoundingClientRect().top;
    S.openOne = S.openOne===idx ? -1 : idx; render();
    const el=document.querySelector(`[data-open-note="${idx}"]`), m=document.querySelector('.main');

  }
  const n=L().sents.length;
  switch(d.a){
    case 'home': goHome(); break;
    case 'unit': { const u=+d.u, was=!!(S.unitOpen && S.unitOpen[u]); S.unitOpen={}; if(!was) S.unitOpen[u]=true; render(); } break;
    case 'noti': toast('새 알림이 없어요'); break;
    case 'relay': toast('프로토타입에서는 코스만 체험할 수 있어요'); break;
    case 'back': openExit(); break;
    case 'exitstay': closeExit(true); break;
    case 'exitleave': closeExit(false); goHome(); break;
    case 'rec': toggleRec(); break;
    case 'send': onText(); break;
    case 'listenall': speak(L().dialog.map(x=>x.en).join(' ')); break;
    case 'koall': { const D=L().dialog, v=!D.every((_,i)=>S.g.ko[i]); D.forEach((_,i)=>{ S.g.ko[i]=v; }); render(); } break;
    case 'skip': {
      /* 누를 때마다 턴 하나씩: 남은 대화 버블을 바로 띄우고, 대화가 끝났으면 타깃턴을 넘김 */
      const D=L().dialog, g=S.g;
      if(g.shown<D.length){
        S.seq++; hush(); g.typing=false; g.fresh=g.shown; g.shown++; render(); scrollMain();
        const token=S.seq;
        speakThen(D[g.shown-1].en, ()=>setTimeout(()=>{ if(token===S.seq && S.stage===1) startGuide(); },350));
      } else {
        stopRec(true); g.done=true; g.fb={kind:'soft', text:'건너뛰었어요. 정답 문장을 듣고 Key Pattern을 배워 볼까요?'}; speak(sentence(0)); render();
      }
    } break;
    case 'exko': S.ex.ko=!S.ex.ko; render(); break;
    case 'pintoggle': S.pinOpen = !(S.pinOpen!==false); render(); break;
    case 'prevex': stopRec(true); S.ex.i=Math.max(0,S.ex.i-1); render(); speak(sentence(S.ex.i)); break;
    case 'nextex': stopRec(true); if(S.ex.i<n-1){S.ex.i++; render(); speak(sentence(S.ex.i));} else go(4); break;
    case 'bko': S.b.ko=!S.b.ko; render(); break;
    case 'hint':
      if(S.view==='app'){ appHint(); break; }
      if(S.stage===6){ S.exp.hint=!S.exp.hint; render(); break; }
      { const i=S.b.i;
        if(S.b.hints[i]<2){
          S.b.hints[i]++;
          if(S.b.hints[i]===1) toast('빈칸마다 앞 두 글자를 열었어요');
          else { S.review.add(i); S.b.done[i]=true; stopRec(true);
            S.b.fb[i]={kind:'review', title:'복습 대기열에 추가했어요', note:'힌트를 모두 사용했어요. 정답 문장을 듣고 다음 문제로 넘어가 보세요.', showAns:true}; speak(sentence(i)); }
        }
        render(); }
      break;
    case 'bcheck': { const i=S.b.i; S.b.done[i]=true; S.b.fb[i]={kind:'review', title:'정답을 확인했어요', note:'원어민 음성을 듣고 따라 말해 보세요.'}; stopRec(true); speak(sentence(i)); render(); } break;
    case 'bprev': bGo(-1); break;
    case 'colsave': { const key=L().coreId+':'+d.k; if(S.colbm.has(key)){ S.colbm.delete(key); toast('단어장에서 뺐어요'); } else { S.colbm.add(key); toast('단어장에 저장했어요'); } render(); } break;
    case 'check': if(canCheck()) doCheck(); break;
    case 'cnext': { const o=S.stage===3?S.ex:S.b; if(o.i<L().sents.length-1) bGo(1); else go(S.stage+1); } break;
    case 'bfwd': bGo(1); break;
    case 'bskip': { const i=S.b.i; S.b.done[i]=true; S.b.fb[i]={kind:'review', title:'건너뛰었어요', note:'정답 문장을 확인해 보세요.'}; stopRec(true); speak(sentence(i)); render(); } break;
    case 'bnext': if(S.b.i<n-1){ S.b.i++; render(); } else go(5); break;
    case 'nextlesson': openLesson(d.li!=null ? +d.li : S.li+1); break;
    case 'reset': S.store={done:[],streak:0,last:''}; save(); goHome(); toast('진행 기록을 초기화했어요'); break;
  }
});

const GLOSS = DATA_ALL.gloss;
S.colbm = new Set();
/* Key Pattern에 포함된 표현은 뜻 모달 대상에서 제외 */
const colEntries = () => {
  if(S.view!=='lesson') return [];
  const pat=' '+norm(L().keyPatternEn.replace(/\[[^\]]*\]/g,' '))+' ';
  return (GLOSS[L().coreId]||[]).filter(e=>!(e.forms&&e.forms.length?e.forms:[e.en]).some(f=>pat.includes(' '+norm(f)+' ')));
};
function wrapCols(root){
  const ents=colEntries(); if(!ents.length) return;
  const map=new Map(), forms=[];
  ents.forEach((e,i)=>(e.forms&&e.forms.length?e.forms:[e.en]).forEach(f=>{ map.set(f.toLowerCase(), i); forms.push(f); }));
  forms.sort((a,b)=>b.length-a.length);
  const re=new RegExp('\\b('+forms.map(f=>f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\b','gi');
  root.querySelectorAll('.colscope').forEach(sc=>{
    const w=document.createTreeWalker(sc,NodeFilter.SHOW_TEXT), nodes=[];
    while(w.nextNode()) nodes.push(w.currentNode);
    nodes.forEach(node=>{
      if(node.parentElement.closest('.col')) return;
      const txt=node.nodeValue; re.lastIndex=0; if(!re.test(txt)) return; re.lastIndex=0;
      const frag=document.createDocumentFragment(); let last=0, m;
      while((m=re.exec(txt))){
        frag.append(txt.slice(last,m.index));
        const s=document.createElement('span'); s.className='col'; s.dataset.col=map.get(m[0].toLowerCase()); s.textContent=m[0]; s.tabIndex=0; s.setAttribute('role','button'); s.setAttribute('aria-label',`${m[0]} 뜻 보기`);
        frag.append(s); last=re.lastIndex;
      }
      frag.append(txt.slice(last)); node.replaceWith(frag);
    });
  });
}
let colActive=null;
function hideCol(){ const p=document.getElementById('colpop'); if(p) p.hidden=true; if(colActive){ colActive.classList.remove('on'); colActive=null; } }
function colPopHtml(i){
  const e=colEntries()[i], key=L().coreId+':'+i, saved=S.colbm.has(key);

}
function showCol(span){
  hideCol();
  const i=+span.dataset.col; if(!colEntries()[i]) return;
  const pop=document.getElementById('colpop'), phone=document.getElementById('phone');
  pop.innerHTML=colPopHtml(i); pop.dataset.i=i; pop.hidden=false; pop.classList.remove('up');
  span.classList.add('on'); colActive=span;
  const pr=phone.getBoundingClientRect(), sr=span.getBoundingClientRect();
  const s=pr.width/phone.offsetWidth || 1, bx=phone.clientLeft, by=phone.clientTop;
  const innerW=phone.clientWidth, innerH=phone.clientHeight, pw=pop.offsetWidth, ph=pop.offsetHeight;
  const cx=(sr.left+sr.width/2-pr.left)/s-bx;
  let left=Math.min(Math.max(12, cx-pw/2), innerW-pw-12);

  if(top+ph>innerH-12){ top=(sr.top-pr.top)/s-by-ph-10; pop.classList.add('up'); }
  pop.style.left=left+'px'; pop.style.top=top+'px'; pop.style.setProperty('--cx',(cx-left)+'px');
}
let lpTimer=null, lastPtr='mouse', lpStart=null;
document.addEventListener('pointerdown',e=>{

['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>{ clearTimeout(lpTimer); lpStart=null; }));

/* 유닛: Unit 시트 + AppTurn 시트 (AI 턴 → Target 턴 → …, 마지막 AI 턴 허용) */
const APP_DEMO_VOICE = { /* 음성 데모 인식 문장 [첫 시도, 재시도] — 없으면 정답 문장 */
  U01:[[q("Let's find common ground on weekend shifts.")],['We should compare rotation and volunteers.','We should weigh rotation against volunteer shifts.'],[q("Based on that, I'd hire new people."),'I think we should hire more people.']]
};
const UNITS = DATA_ALL.units.map(u=>{
  const ai=[], turns=[], steps=[];
  u.turns.forEach(r=>{
    if(r.speaker==='Target'){
      const li=LESSONS.findIndex(l=>l.coreId===r.coreId), t=turns.length, answer=q(r.en);
      turns.push({li, ko:r.kr, answer, hint:r.hint, must:String(r.must||'').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean), aiBefore:ai.length-1, voice:(APP_DEMO_VOICE[u.unitId]||[])[t]||[answer]});
      steps.push({k:'task', t});
    } else { steps.push({k:'ai', i:ai.length}); ai.push({en:q(r.en), ko:r.kr}); }
  });
  return {id:u.unitId, order:u.unitOrder, title:u.unitTitle, intro:u.unitIntro, context:u.unitContext, mission:u.unitMission, userRole:u.userRole, aiName:u.aiName, aiRole:u.aiRole, appId:'APP-'+u.unitId, ai, turns, steps};
});
let UNIT=UNITS[0], APP_AI=UNIT.ai, APP_TURNS=UNIT.turns;
function setUnit(ui){ S.ui=ui; UNIT=UNITS[ui]; APP_AI=UNIT.ai; APP_TURNS=UNIT.turns; }
const pad2 = n => String(n).padStart(2,'0');
/* 다음 Target 턴까지의 구간 (t=-1이면 처음부터) */
function segment(t){
  const st=UNIT.steps, from = t<0 ? 0 : st.findIndex(s=>s.k==='task' && s.t===t)+1;
  let to=st.findIndex((s,j)=>j>=from && s.k==='task'); if(to<0) to=st.length-1;
  return st.slice(from,to+1).map(s=>({...s}));
}
function appState(){ return {stage:'intro', log:[], queue:[], typing:false, t:-1, awaiting:false, attempt:0, hintUsed:false, typed:'', results:[], finished:false, saved:new Set(), ko:{}}; }
S.app = appState();

function patternOK(l,text){
  const iw=x=>x.replace(/\bi would\b/g,"i'd");
  const n=iw(norm(text)), fx=l.keyPatternEn.split(/\[[^\]]*\]/).map(p=>iw(norm(p))).filter(Boolean);
  let pos=0;
  for(let k=0;k<fx.length;k++){ const idx=n.indexOf(fx[k],pos); if(idx<0 || (k===0 && idx!==0)) return false; pos=idx+fx[k].length; }
  return true;
}
function judge(t,text){
  const T=APP_TURNS[t], l=LESSONS[T.li], n=norm(text);
  const p=patternOK(l,text), m=T.must.every(k=>n.includes(k));
  return {status: p&&m ? 'success' : (p||m) ? 'review' : 'fail', pattern:p, meaning:m};
}
function openApp(ui){ stopRec(true); S.seq++; hush(); setUnit(ui==null?(S.ui||0):ui); S.view='app'; S.app=appState(); S._last=null; render(); document.querySelector('.main')?.scrollTo(0,0); }
function appStartChat(){ const A=S.app; A.stage='chat'; A.start=Date.now(); A.queue=segment(-1); render(); appPump(); }
function appPump(){
  const A=S.app, token=S.seq;
  if(S.view!=='app' || A.stage!=='chat') return;
  const it=A.queue[0];
  if(!it){ if(!A.awaiting && !A.finished && A.results.filter(Boolean).length===APP_TURNS.length){ A.finished=true; render(); scrollMain(); } return; }
  if(it.k==='ai'){
    if(it.shown){ A.queue.shift(); appPump(); return; }
    A.typing=true; render(); scrollMain();
    setTimeout(()=>{
      if(token!==S.seq) return;
      A.typing=false; A.log.forEach(e=>e.fresh=false); A.log.push({type:'ai', i:it.i, fresh:true}); it.shown=true; render(); scrollMain();
      speakThen(APP_AI[it.i].en, ()=>setTimeout(()=>{ if(token!==S.seq) return; A.queue.shift(); appPump(); },300));
    },700);
  } else {
    A.queue.shift(); A.log.forEach(e=>e.fresh=false);
    A.t=it.t; A.attempt=0; A.hintUsed=false; A.awaiting=true;
    A.log.push({type:'task', t:it.t, fresh:true}); render(); scrollMain();
  }
}
/* 턴별 건너뛰기: AI 턴은 바로 띄우고, 타깃턴은 정답 공개 후 오답 처리 */
function appSkip(){
  const A=S.app; if(A.stage!=='chat' || A.finished) return;
  stopRec(true);
  if(A.awaiting){
    A.log.forEach(e=>e.fresh=false);
    A.log.push({type:'line', text:'이 턴을 건너뛰었어요.'}); A.log.push({type:'answer', t:A.t});
    speak(APP_TURNS[A.t].answer); resolveTurn({status:'fail', pattern:false, meaning:false}, '(건너뜀)');
    render(); scrollMain(); return;
  }
  const it=A.queue[0]; if(!it || it.k!=='ai') return;
  S.seq++; hush();
  if(it.shown){ A.queue.shift(); appPump(); return; }
  A.typing=false; A.log.forEach(e=>e.fresh=false); A.log.push({type:'ai', i:it.i, fresh:true}); it.shown=true; render(); scrollMain();
  const token=S.seq;
  speakThen(APP_AI[it.i].en, ()=>setTimeout(()=>{ if(token===S.seq){ A.queue.shift(); appPump(); } },300));
}
function appHint(){
  const A=S.app; if(!A.awaiting || A.hintUsed) return;
  A.hintUsed=true; A.log.forEach(e=>e.fresh=false); A.log.push({type:'hint', t:A.t, fresh:true}); render(); scrollMain();
}
function appSubmit(text,voice){
  const A=S.app; if(!A.awaiting) return;
  text=q(String(text||'').trim()); if(!text) return; if(!/[.!?]$/.test(text)) text+='.';
  const r=judge(A.t,text);
  A.log.forEach(e=>e.fresh=false);
  A.log.push({type:'user', t:A.t, text, status:r.status, voice, fresh:true}); A.typed='';
  if(r.status==='success' || (A.attempt===1 && r.status==='review')) resolveTurn(r,text);
  else if(A.attempt===0){
    A.attempt=1;
    if(!A.hintUsed){ A.hintUsed=true; A.log.push({type:'hint', t:A.t}); }
    A.log.push({type:'line', text:'한 번 더 말해 보세요. 기회는 1번 남았어요.'});
  } else {
    A.log.push({type:'answer', t:A.t}); speak(APP_TURNS[A.t].answer); resolveTurn(r,text);
  }
  render(); scrollMain();
}
function resolveTurn(r,text){
  const A=S.app, t=A.t;
  A.results[t]={status:r.status, pattern:r.pattern, meaning:r.meaning, text, attempt:A.attempt};
  A.awaiting=false;
  A.queue=segment(t);
  if(A.queue.length){ const token=S.seq; setTimeout(()=>{ if(token===S.seq) appPump(); }, r.status==='fail'?2800:900); }
  else A.finished=true;
}

    if(e.type==='line') return `<div class="sysline">${esc(e.text)}</div>`;
    if(e.type==='user') return `<div class="msg me ${fr}"><div style="display:flex;flex-direction:column;align-items:flex-end"><div class="bubble"><div class="en">${esc(e.text)}</div></div><span class="stchip st-${e.status}">${ic(ST_ICON[e.status],14)}${ST_LABEL[e.status]}${e.voice?'<span class="muted" style="font-weight:500"> · 인식된 문장(데모)</span>':''}</span></div></div>`;
    if(e.type==='answer'){ const a=APP_TURNS[e.t].answer; return `<div class="sysmsg"><div class="sys-h">정답 문장</div><div class="sys-p" style="display:flex;align-items:center;justify-content:center;gap:8px"><span>${esc(a)}</span><button class="chip" data-speak="${esc(a)}" aria-label="정답 듣기">${ic('speaker',15)}</button></div></div>`; }
    return '';
  }).join('');
  const typing = A.typing ? `<div class="msg">${avatar}<div><div class="who">${esc(UNIT.aiName)}</div><div class="bubble">${dots}</div></div></div>` : '';
  const T=APP_TURNS[A.t];
  const target = A.awaiting ? `<div class="target"><div class="hint-t">영어로 말해 보세요</div><div style="font-size:15px;font-weight:700;line-height:1.5">${esc(T.ko)}</div></div>` : '';
  return head(UNIT.title,'Application')
    + `<div class="pin"><div style="font-size:11.5px;font-weight:800;color:var(--muted)">Mission</div><p style="font-size:13.5px;font-weight:700;color:var(--ink);margin-top:2px">${esc(UNIT.mission)}</p></div>`
    + `<div class="aprog"><div class="segs">${APP_TURNS.map((_,i)=>`<i class="${A.results[i]?'on':''}"></i>`).join('')}</div><span>Task ${done} / ${N}</span></div>`
    + `<div class="main"><div class="chat">${log}${typing}${target}</div></div>`
    + dock({hint:true, hintDisabled:!A.awaiting||A.hintUsed, placeholder:'영어로 입력해 보세요', value:A.typed, voiceLabel:A.awaiting?'영어로 말해 보세요':'대화를 듣는 중이에요', locked:!A.awaiting})
    + foot(`<div class="row">${A.finished?'':`<button class="ghost" data-a="appskip">다음 &gt;&gt;</button>`}<button class="cta" data-a="appresult" ${A.finished?'':'disabled'}>결과보기</button></div>`);
}

function appResult(){
  const A=S.app, N=APP_TURNS.length;
  const R=APP_TURNS.map((_,t)=>A.results[t]||{status:'fail',pattern:false,meaning:false,text:'-',attempt:1});
  const okN=R.filter(r=>r.status==='success').length;
  const acc=Math.round(R.reduce((s,r)=>s+(r.status==='success'?100:r.status==='review'?50:0),0)/N);
  const mins=Math.max(1,Math.round((Date.now()-(A.start||Date.now()))/60000));
  const cards=APP_TURNS.map((T,t)=>{
    const r=R[t], l=LESSONS[T.li], open=A.openOne===t, saved=A.saved.has(t);
    const kind = r.status==='success' ? (r.attempt ? 'retry' : 'first') : r.status;
    const label = {first:'최초 성공', retry:'재시도 성공', review:'검토 필요', fail:'오답'}[kind];
    const icon = {first:'check', retry:'check', review:'alert', fail:'x'}[kind];
    const tags=[]; if(!r.meaning) tags.push('의미 불명확'); if(!r.pattern) tags.push('패턴 미사용');
    let gram=''; if(r.pattern){ const ev=evaluate(l,r.text); if(ev.kind==='bad' && ev.title.indexOf('문법')>=0){ tags.push('문법 오류'); gram=' '+ev.note; } }
    const fbTxt = kind==='first' ? '의미와 Key Pattern을 모두 정확하게 전달했어요.'
      : kind==='retry' ? '두 번째 시도에서 의미와 Key Pattern을 모두 정확하게 전달했어요.'
      : kind==='review' ? (!r.pattern ? `뜻은 통했지만 Key Pattern을 쓰지 않았어요. ‘${stem(l)}’ 패턴으로 말해 보세요.` : 'Key Pattern은 잘 썼지만, Task에서 요구한 내용과 조금 달라요. 국문 뜻을 다시 확인해 보세요.')
      : 'Task에서 요구한 내용과 Key Pattern을 모두 다시 확인해 보세요.';
    /* 나의 답변: 성공이 아니면 추천 문장에 없는 단어를 강조 */
    const ansWords=new Set(norm(T.answer).split(' '));
    const myHtml = r.status==='success' ? esc(r.text) : r.text.split(' ').map(w=>{ const n=norm(w); return n && !ansWords.has(n) ? `<span class="err">${esc(w)}</span>` : esc(w); }).join(' ');
    const body = open ? `<div class="rc-body">
        ${T.aiBefore>=0?`<div class="rbub-ai">${esc(APP_AI[T.aiBefore].en)}</div>`:''}
        <div class="rbub-me">${myHtml}</div>
        <div class="rc-lbl">피드백</div>
        ${tags.length?`<div class="chips2">${tags.map(x=>`<span>${x}</span>`).join('')}</div>`:''}
        <div class="rc-fb">${esc(fbTxt+gram)}</div>
        <div class="rc-rech"><span class="rc-lbl">추천 문장</span><span style="display:flex;gap:6px"><button class="chip ${saved?'on':''}" data-a="appsave" data-t="${t}" aria-label="${saved?'저장 취소':'추천 문장 저장'}" aria-pressed="${saved}">${ic('bookmark',15,saved)}</button><button class="chip" data-speak="${esc(T.answer)}" aria-label="추천 문장 듣기">${ic('speaker',15)}</button></span></div>
        <div class="rc-rec2">${recHtml(l,T.answer)}</div>
        <div class="rc-ko">${esc(T.ko)}</div>
        <div class="rc-box"><span>${esc(String(l.patternBanner||'').split('\n')[0])}</span><button class="golesson" data-a="applesson" data-li="${T.li}">${ic('send',14)}레슨 바로가기</button></div>
      </div>` : '';
    return `<div class="rc ${kind}">
      <button class="rc-head" data-a="appopen" data-t="${t}" aria-expanded="${open}">
        <span class="tt"><span class="rc-st">${ic(icon,16)}${label}</span><span class="rc-title">${esc(l.coreTitle)}</span><span class="rc-pat">${esc(l.keyPatternEn)}</span></span>
        ${ic(open?'up':'down',18)}
      </button>${body}</div>`;
  }).join('');
  return head(UNIT.title,'Application') + `<div class="main">
    <div class="stats"><div><b>${okN}/${N}</b><small>Task 달성</small></div><div><b>${acc}%</b><small>문장 정확도</small></div><div><b>${mins}분</b><small>소요 시간</small></div></div>
    <p class="sec-h">나의 답변</p><div class="rlist">${cards}</div>
  </div>` + foot(`<div class="row"><button class="ghost" style="flex:1" data-a="appretry">다시하기</button><button class="cta" style="flex:1" data-a="appdone">완료하기</button></div>`);
}

function appDone(){
  const streak=Math.max(1,S.store.streak), today=new Date(), days=[];
  for(let k=-2;k<=4;k++){ const d=new Date(today); d.setDate(today.getDate()+k); days.push({k, on:k<=0 && k>-streak, label:k===0?'오늘':`${d.getMonth()+1}/${d.getDate()}`}); }
  return `<div class="main" style="padding-top:24px"><div class="done">
      <div class="medal"><div>${ic('check',38)}</div></div>
      <h2>${esc(UNIT.title)}<br>Application 완료!</h2><p class="muted" style="margin:0;font-size:14.5px">배운 표현으로 상황을 해결했어요!</p></div>
    <div class="streak"><div class="h"><span>${streak}일 연속 학습 중!</span><small>이번 주 ${weekTotal()}개 완료</small></div>
      <div class="days">${weekRow()}</div></div>
    ${(()=>{ const nu=UNITS[S.ui+1]; return nu
      ? `<div class="next"><div class="h"><span>UNIT ${pad2(UNIT.order)} 완료</span><span>다음 유닛</span></div><b>UNIT ${pad2(nu.order)}. ${esc(nu.title)}</b><p>${esc(nu.intro)}</p></div>`
      : `<div class="next"><div class="h"><span>UNIT ${pad2(UNIT.order)} 완료</span></div><b>${esc(UNIT.title)}</b><p>코스의 모든 유닛을 마쳤어요.</p></div>`; })()}
  </div>` + foot((()=>{ const nu=UNITS[S.ui+1]; if(!nu) return `<button class="cta" data-a="home">코스로 돌아가기</button>`; const fi=LESSONS.findIndex(l=>l.unitId===nu.id); return `<button class="cta" data-a="nextlesson" data-li="${fi}">다음 유닛 시작하기</button><button class="textbtn" data-a="home">오늘은 여기까지</button>`; })());
}
const appScreen = () => ({intro:appIntro, chat:appChat, result:appResult, done:appDone})[S.app.stage]();

document.addEventListener('click',e=>{
  const t=e.target.closest && e.target.closest('button'); if(!t || t.disabled) return;
  const a=t.dataset.a;
  if(a==='openapp'){ openApp(t.dataset.u!=null ? +t.dataset.u : null); }
  else if(a==='appstart'){ appStartChat(); }
  else if(a==='appresult'){ stopRec(true); S.seq++; hush(); S.app.openOne=S.app.results.findIndex(r=>!r || r.status!=='success'); S.app.stage='result'; render(); document.querySelector('.main')?.scrollTo(0,0); }
  else if(a==='appdone'){ markDone(UNIT.appId); S.app.stage='done'; render(); }
  else if(a==='applesson'){ openLesson(+t.dataset.li); }
  else if(a==='appsave'){ const i=+t.dataset.t; if(S.app.saved.has(i)){ S.app.saved.delete(i); toast('저장을 취소했어요'); } else { S.app.saved.add(i); toast('보관함에 저장했어요'); } render(); }
  else if(a==='appopen'){
    /* 하나만 열기 + 누른 카드 위치 유지 */
    const i=+t.dataset.t, phone=document.getElementById('phone');
    const sc=phone.getBoundingClientRect().width/phone.offsetWidth || 1, before=t.getBoundingClientRect().top;
    S.app.openOne = S.app.openOne===i ? -1 : i; render();
    const el=document.querySelector(`[data-a="appopen"][data-t="${i}"]`), m=document.querySelector('.main');
    if(el && m) m.scrollTop += (el.getBoundingClientRect().top-before)/sc;
  }
  else if(a==='appretry'){ openApp(S.ui); }
  else if(a==='appskip'){ appSkip(); }
  else if(a==='appko'){ const i=+t.dataset.i; S.app.ko[i]=!S.app.ko[i]; render(); }
});


/* ---------- sentence building: swipe the card to move between items ---------- */
function bGo(dir){
  const n=L().sents.length, o=S.stage===3?S.ex:S.b, ni=o.i+dir;
  if(ni<0){ toast('첫 번째 카드예요'); return; }
  if(ni>=n){ toast('마지막 카드예요'); return; }
  stopRec(true); o.i=ni; if(S.stage===3) S.ex.typed=''; render();
  if(S.stage===3) speak(sentence(ni));
}
let sw=null;
document.addEventListener('pointerdown',e=>{
  const c=e.target.closest && e.target.closest('[data-swipe]');
  if(!c || e.target.closest('input,button')) return;
  sw={x:e.clientX, y:e.clientY, el:c};
});
document.addEventListener('pointermove',e=>{
  if(!sw) return; const dx=e.clientX-sw.x, dy=e.clientY-sw.y;
  if(Math.abs(dx)>Math.abs(dy)){ sw.el.style.transition='none'; sw.el.style.transform=`translateX(${dx*0.6}px)`; }
});
function swEnd(e){
  if(!sw) return; const dx=e.clientX-sw.x, dy=e.clientY-sw.y, el=sw.el; sw=null;
  el.style.transition=''; el.style.transform='';
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)) bGo(dx<0?1:-1);
}
document.addEventListener('pointerup',swEnd);
document.addEventListener('pointercancel',e=>{ if(sw){ sw.el.style.transition=''; sw.el.style.transform=''; sw=null; } });

/* ---------- exit confirm modal ---------- */
function openExit(){
  stopRec(true); S.seq++; hush(); hideCol();
  const m=document.getElementById('exitmodal'); m.hidden=false; m.querySelector('.mstay').focus();
}
function closeExit(resume){
  document.getElementById('exitmodal').hidden=true;
  if(resume && S.view==='lesson' && S.stage===1 && S.g.shown<L().dialog.length) startGuide();
  if(resume && S.view==='app' && S.app.stage==='chat' && S.app.queue.length) appPump();
}
document.addEventListener('click',e=>{ if(e.target.id==='exitmodal') closeExit(true); });
document.addEventListener('keydown',e=>{ const m=document.getElementById('exitmodal'); if(e.key==='Escape' && m && !m.hidden) closeExit(true); });

function fit(){
  const el=document.getElementById('fit');
  if(window.innerWidth<=760){ el.style.transform=''; el.style.margin=''; return; }
  const s=Math.min(1,(window.innerHeight-32)/872);
  el.style.transform=`scale(${s})`;
  el.style.margin = s<1 ? `${-(872*(1-s))/2}px 0` : '';
}
window.addEventListener('resize',fit);
fit(); render();
})();

</script>
